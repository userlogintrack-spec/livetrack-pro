<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bad request — LiveVisitorHub</title>
    <meta name="theme-color" content="#fbfbfd">
    <link rel="icon" type="image/svg+xml" href="/static/images/icon-192.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #fbfbfd; --card: #ffffff; --text: #1d1d1f; --muted: #6e6e73;
            --border: #e8e8ed; --accent: #0071e3; --accent-hover: #0077ED;
        }
        @media (prefers-color-scheme: dark) {
            :root { --bg: #000; --card: #1c1c1e; --text: #f5f5f7; --muted: #aeaeb2;
                    --border: #2c2c2e; --accent: #0a84ff; --accent-hover: #409cff; }
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', system-ui, sans-serif;
            background: var(--bg); color: var(--text);
            min-height: 100vh; display: flex; align-items: center; justify-content: center;
            padding: 24px; line-height: 1.5;
        }
        .card {
            max-width: 460px; width: 100%; text-align: center;
            background: var(--card); border: 1px solid var(--border);
            border-radius: 18px; padding: 56px 32px 40px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.04);
        }
        .code {
            font-size: 72px; font-weight: 800; letter-spacing: -2px;
            color: var(--text); line-height: 1; margin-bottom: 8px;
            font-feature-settings: "tnum";
        }
        h1 { font-size: 22px; font-weight: 700; margin-bottom: 10px; letter-spacing: -0.3px; }
        p  { font-size: 15px; color: var(--muted); margin-bottom: 28px; }
        .actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
        .btn {
            display: inline-flex; align-items: center; gap: 8px;
            padding: 11px 22px; border-radius: 10px;
            font-weight: 600; font-size: 14px; text-decoration: none;
            transition: all 0.15s ease; border: 1px solid transparent;
            font-family: inherit;
        }
        .btn-primary { background: var(--accent); color: #fff; }
        .btn-primary:hover { background: var(--accent-hover); transform: translateY(-1px); }
    </style>
    <script>
        (function() {
            var t = localStorage.getItem('dashTheme');
            if (t) document.documentElement.setAttribute('data-theme', t);
        })();
    </script>
</head>
<body>
    <main class="card" role="main">
        <div class="code">400</div>
        <h1>Bad request</h1>
        <p>The request couldn't be processed. This usually means a malformed URL or expired session — refresh and try again.</p>
        <div class="actions">
            <a href="/dashboard/" class="btn btn-primary">Go to dashboard</a>
        </div>
    </main>
</body>
</html>
