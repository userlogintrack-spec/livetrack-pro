<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found — LiveVisitorHub</title>
    <meta name="theme-color" content="#fbfbfd">
    <link rel="icon" type="image/svg+xml" href="/static/images/icon-192.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #fbfbfd; --card: #ffffff; --text: #1d1d1f; --muted: #6e6e73;
            --border: #e8e8ed; --accent: #0071e3; --accent-hover: #0077ED;
        }
        @media (prefers-color-scheme: dark) {
            :root { --bg: #000; --card: #1c1c1e; --text: #f5f5f7; --muted: #aeaeb2;
                    --border: #2c2c2e; --accent: #0a84ff; --accent-hover: #409cff; }
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', system-ui, sans-serif;
            background: var(--bg); color: var(--text);
            min-height: 100vh; display: flex; align-items: center; justify-content: center;
            padding: 24px; line-height: 1.5;
        }
        .card {
            max-width: 460px; width: 100%; text-align: center;
            background: var(--card); border: 1px solid var(--border);
            border-radius: 18px; padding: 56px 32px 40px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.04);
        }
        .icon-wrap {
            width: 80px; height: 80px; border-radius: 50%;
            background: rgba(0,113,227,0.08); color: var(--accent);
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 24px; font-size: 32px; font-weight: 800;
        }
        .code {
            font-size: 72px; font-weight: 800; letter-spacing: -2px;
            color: var(--text); line-height: 1; margin-bottom: 8px;
            font-feature-settings: "tnum";
        }
        h1 { font-size: 22px; font-weight: 700; margin-bottom: 10px; letter-spacing: -0.3px; }
        p  { font-size: 15px; color: var(--muted); margin-bottom: 28px; }
        .actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
        .btn {
            display: inline-flex; align-items: center; gap: 8px;
            padding: 11px 22px; border-radius: 10px;
            font-weight: 600; font-size: 14px; text-decoration: none;
            transition: all 0.15s ease; border: 1px solid transparent;
            cursor: pointer; font-family: inherit;
        }
        .btn-primary { background: var(--accent); color: #fff; }
        .btn-primary:hover { background: var(--accent-hover); transform: translateY(-1px); }
        .btn-secondary { background: transparent; color: var(--text); border-color: var(--border); }
        .btn-secondary:hover { background: var(--card); border-color: var(--muted); }
        .meta { margin-top: 32px; padding-top: 20px; border-top: 1px solid var(--border);
                font-size: 12px; color: var(--muted); }
        .meta a { color: var(--accent); text-decoration: none; }
        .meta a:hover { text-decoration: underline; }
    </style>
    <script>
        (function() {
            var t = localStorage.getItem('dashTheme');
            if (t) document.documentElement.setAttribute('data-theme', t);
        })();
    </script>
</head>
<body>
    <main class="card" role="main">
        <div class="code">404</div>
        <h1>Page not found</h1>
        <p>The link you followed may be broken, or the page may have been moved or deleted.</p>
        <div class="actions">
            <a href="/dashboard/" class="btn btn-primary">Go to dashboard</a>
            <a href="#" onclick="if(history.length>1){history.back();return false;}" class="btn btn-secondary">Back</a>
        </div>
        <div class="meta">
            Need help? <a href="/contact/">Contact support</a>
        </div>
    </main>
</body>
</html>
